<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Kausar Patherya">
    <meta name="description" content="Research project by Kausar Patherya.">
    <meta name="theme-color" content="#f5f2ea">
    <title>Research Project | Kausar Patherya</title>
    <link rel="icon" href="/images/favicon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheet.css">
    <script src="/project.js" defer></script>
  </head>
  <body data-project="situp">
    <a class="skip-link" href="#project-content">Skip to project content</a>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Kausar Patherya, home">
        <span class="wordmark-mark" aria-hidden="true">KP</span>
        <span>Kausar Patherya</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/#featured-work">Work</a>
        <a href="/#research">Research</a>
        <a href="/#about">About</a>
      </nav>
    </header>

    <main class="project-page section-shell" id="project-content">
      <a class="back-link" href="/#featured-work">Back to all work</a>
      <header class="project-hero">
        <div class="project-hero-copy">
          <div class="project-meta project-page-meta">
            <span class="project-eyebrow" id="project-eyebrow"></span>
            <span class="status-tag" id="project-status"></span>
          </div>
          <h1 id="project-title"></h1>
          <p class="project-detail-headline" id="project-headline"></p>
          <p class="project-summary project-page-summary" id="project-summary"></p>
          <p class="project-collaborators" id="project-collaborators" hidden></p>
          <div class="hero-actions" id="project-actions"></div>
        </div>
        <figure class="project-figure">
          <img id="project-image" src="" alt="">
        </figure>
      </header>

      <div class="project-detail-grid">
        <section aria-labelledby="problem-heading">
          <p class="detail-number">01</p>
          <h2 id="problem-heading">Problem</h2>
          <p id="project-problem"></p>
        </section>
        <section aria-labelledby="contribution-heading">
          <p class="detail-number">02</p>
          <h2 id="contribution-heading">Contribution</h2>
          <p id="project-contribution"></p>
        </section>
        <section id="project-pipeline" aria-labelledby="pipeline-heading">
          <p class="detail-number">03</p>
          <h2 id="pipeline-heading">System / Pipeline</h2>
        </section>
        <section id="project-evidence" aria-labelledby="evidence-heading">
          <p class="detail-number">04</p>
          <h2 id="evidence-heading">Evidence</h2>
        </section>
        <section class="detail-wide" aria-labelledby="limitations-heading">
          <p class="detail-number">05</p>
          <h2 id="limitations-heading">Limitations / Status</h2>
          <p id="project-limitations"></p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div><strong>Kausar Patherya</strong><p>AI systems research across language, perception, sensors, and robotics.</p></div>
      <a href="/#featured-work">View all work</a>
    </footer>
  </body>
</html>
