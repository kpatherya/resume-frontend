name: Upload Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-2'   # optional: defaults to us-east-1
        SOURCE_DIR: 'public'
    - name: Publish project route aliases
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-east-2'
      run: |
        for index_file in public/projects/*/index.html; do
          slug=${index_file#public/projects/}
          slug=${slug%/index.html}
          aws s3api put-object \
            --bucket "$AWS_S3_BUCKET" \
            --key "projects/$slug/" \
            --body "$index_file" \
            --content-type "text/html; charset=utf-8" \
            --acl public-read
        done
    # NOTE: CloudFront invalidation is NOT automated here.
    #
    # This workflow only writes to S3. Visitors are served by CloudFront, so a
    # deploy is not visible until the cache is invalidated -- expect stale
    # content (especially replaced assets such as static/*.pdf) until then.
    #
    # Invalidate manually in the AWS console: CloudFront -> the
    # kausarpatherya.com distribution -> Invalidations -> Create, with /* (or
    # the specific changed paths).
    #
    # To automate it, grant the `Autofront` IAM user cloudfront:ListDistributions
    # and cloudfront:CreateInvalidation, then restore the step removed here.
    # Without those permissions the step fails with AccessDenied and reds the
    # whole deploy.